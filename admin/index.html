        :root { --accent: #3b82f6; }
        body { background: #f8fafc; font-family: 'Inter', sans-serif; color: #1e293b; }
        .sidebar { transition: all 0.3s ease; background: white; border-right: 1px solid #e2e8f0; }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); position: fixed; z-index: 100; height: 100%; } .sidebar.open { transform: translateX(0); } }
        .active-link { background: var(--accent) !important; color: white !important; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        
        .table-scroll::-webkit-scrollbar { height: 6px; }
        .table-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        th, td { white-space: nowrap; }
        
        /* Toggle Switch Style */
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(26px); }
    </style>

       async function updateBonusSettings() {
    const isActive = document.getElementById('bonus-toggle').checked;
    const amount = document.getElementById('bonus-amt').value;

    const { error } = await _db.from('config').upsert({
        key: 'registration_bonus',
        value: amount,
        is_active: isActive
    });

    if(error){
        console.log(error);
        alert(error.message);
    }else{
        alert("Settings Updated!");
    }
}

        async function updateWithdrawalStatus(id, status) {

            const { error } = await _db.from('withdrawals').update({status: status}).eq('id', id);
            if(!error) { alert("Status Locked!"); tab('withdrawals'); }
        }

async function updateWallet(type) {
    const q = document.getElementById('wq').value.trim();
    const a = parseFloat(document.getElementById('wa').value);

    if (!q || isNaN(a) || a <= 0) {
        return alert("Enter valid details!");
    }

    const { data: users, error: userError } = await _db
        .from('profiles')
        .select('mobile, invite_code, balance')
        .or(`mobile.eq.${q},invite_code.eq.${q}`);

    if (userError) {
        return alert("User search failed: " + userError.message);
    }

    if (!users || users.length === 0) {
        return alert("User not found! Check Mobile Number or Invite Code.");
    }

    const u = users[0];
    const oldBalance = Number(u.balance || 0);

    const nb = type === 'gift'
        ? oldBalance + a
        : oldBalance - a;

    if (nb < 0) {
        return alert("Insufficient balance!");
    }

    // 1. User balance update
    const { error: balanceError } = await _db
        .from('profiles')
        .update({ balance: nb })
        .eq('mobile', u.mobile);

    if (balanceError) {
        return alert("Balance update failed: " + balanceError.message);
    }

    // 2. Admin System Logs save
    const { error: logError } = await _db
        .from('system_logs')
        .insert([{
            invite_code: u.invite_code,
            user_mobile: u.mobile,
            type: type,
            amount: Number(a),
            reason: type === 'gift' ? 'System Gift' : 'Deduction',
            post_balance: nb
        }]);

    if (logError) {
        return alert("System Log save failed: " + logError.message);
    }

    // 3. User Points History save
    const { error: pointsError } = await _db
        .from('points_details')
        .insert([{
            mobile_no: u.mobile,
            invite_code: u.invite_code,
            amount: type === 'gift' ? Number(a) : -Number(a),
           reason: type === 'gift' ? 'System Gift' : 'Deduction',
            post_balance: nb
        }]);

    if (pointsError) {
        return alert("Points History save failed: " + pointsError.message);
    }

    alert(
        type === 'gift'
            ? "Gift added successfully!"
            : "Deduct completed successfully!"
    );

    document.getElementById('wq').value = '';
    document.getElementById('wa').value = '';

    tab('wallet');
}

        async function ban(m, s) {
    const newStatus = s === 'active' ? 'banned' : 'active';

        .from('profiles')
        .update({

        })

        return alert("Failed to update user status: " + error.message);

    );

}

function filterPointsHistory() {
    const search = document
        .getElementById('pointsSearch')
        .value
        .trim()
        .toLowerCase();

    document
        .querySelectorAll('#pointsHistoryTable tr[data-mobile]')
        .forEach(row => {
            const mobile = row.dataset.mobile.toLowerCase();
            const invite = row.dataset.invite.toLowerCase();

            row.style.display =
                mobile.includes(search) || invite.includes(search)
                    ? ''
                    : 'none';
        });
}
